# Copy to bots.local.yaml (git-ignored) and fill in your bots.
#   cp bots.example.yaml bots.local.yaml
#
# Each bot must have the playground plugin enabled (see docs/protocol.md).
#
# Fields
#   id        unique key (letters, digits, dashes)
#   name      label shown in the UI (defaults to id)
#   baseUrl   the bot server's base URL; the plugin lives under <baseUrl>/playground
#   token     the bot's PLAYGROUND_TOKEN
#   tokenEnv  alternative to token: name of an environment variable holding it

bots:
  - id: my-bot
    name: my-bot（本番）
    baseUrl: https://my-bot-xxxxxxxx-an.a.run.app
    tokenEnv: MY_BOT_PLAYGROUND_TOKEN

  # A bot running on this Mac, reached from inside docker compose.
  # - id: my-bot-local
  #   name: my-bot（ローカル）
  #   baseUrl: http://host.docker.internal:8080
  #   token: local-playground-token
